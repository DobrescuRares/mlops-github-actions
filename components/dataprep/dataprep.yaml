$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: data_prep_image_resize_cli
version: 0.1.1
display_name: Data Prep Image Resize (CLI)
description: Resizes the input images
type: command
is_deterministic: true
environment_variables:
  SIZE: "64"

environment: azureml:aml-preprocessing-cli:0.1.0

resources:
  instance_count: 1

code: ./code
command: "python dataprep.py --data ${{inputs.data}} --output_data ${{outputs.output_data}}"

inputs:
  data:
    type: uri_folder
    optional: false

outputs:
  output_data:
    type: uri_folder
