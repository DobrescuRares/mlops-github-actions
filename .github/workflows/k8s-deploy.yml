name: K8s Deployment

on:
  workflow_dispatch:
  push:
    branches: [main, 03_K8s]
    paths:
      - "k8s/deployment.yaml"
      - "k8s/service.yaml"
      - ".github/workflows/k8s-deploy.yml"

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    env:
      NAMESPACE: rares
    steps:
      - name: Check out code repository
        uses: actions/checkout@v7

      - name: Create namespace if it doesn't exist
        run: kubectl create namespace $env:NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply deployment and service
        run: kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml

      - name: Rollout restart (pull same image tag again)
        run: kubectl rollout restart deployment/hello-nginx -n $env:NAMESPACE

      - name: Wait for rollout
        run: kubectl rollout status deployment/hello-nginx -n $env:NAMESPACE --timeout=120s

      - name: Show resources
        run: kubectl get deploy,rs,pods,svc -n $env:NAMESPACE

      - name: Test via NodePort
        run: curl.exe -s http://localhost:30080
